version: "3.8"

services:
  # ── Nginx Edge Reverse Proxy & Load Balancer ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: car_worth_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend_1:
        condition: service_healthy
      backend_2:
        condition: service_healthy
      backend_3:
        condition: service_healthy
    networks:
      - app_network

  # ── Backend Replica 1 ───────────────────────────────────────────────────
  backend_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_worth_backend_1
    restart: unless-stopped
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://caruser:carpass@postgres:5432/cardb
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - CACHE_TTL_SECONDS=86400
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  # ── Backend Replica 2 ───────────────────────────────────────────────────
  backend_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_worth_backend_2
    restart: unless-stopped
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://caruser:carpass@postgres:5432/cardb
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - CACHE_TTL_SECONDS=86400
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  # ── Backend Replica 3 ───────────────────────────────────────────────────
  backend_3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_worth_backend_3
    restart: unless-stopped
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://caruser:carpass@postgres:5432/cardb
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - CACHE_TTL_SECONDS=86400
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  # ── Redis (Distributed Caching & Rate Limiting) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: car_worth_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # ── PostgreSQL Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: car_worth_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=caruser
      - POSTGRES_PASSWORD=carpass
      - POSTGRES_DB=cardb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caruser -d cardb"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
